<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List With Cart</title>

    <link rel="shortcut icon" href="./src/images/favicon-32x32.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/responsive.css">

</head>

<body>

    <main class="main">
        <section class="foodCategory">
            <h1 class="foodCategory__title">Desserts</h1>
            <div class="foodsContainer"></div>
        </section>

        <section>
            <h2>Your Cart <span></span></h2>
            <div>
                <div>
                    <div>
                        <h2></h2>
                        <div>
                            <p>4x</p>
                            <div>
                                <p>@$7.00</p>
                                <p>$28.00</p>
                            </div>
                        </div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="none" viewBox="0 0 10 10">
                        <path fill="#CAAFA7"
                            d="M8.375 9.375 5 6 1.625 9.375l-1-1L4 5 .625 1.625l1-1L5 4 8.375.625l1 1L6 5l3.375 3.375-1 1Z" />
                    </svg>

                </div>

                <div>
                    <p>Order Total</p>
                    <p>$<span></span></p>
                </div>
            </div>

            <div>
                <p>This is a <strong>carbon-neutral</strong> delivery</p>
            </div>

            <button>Confirm Order</button>
        </section>









    </main>




    <script src="./src/js/index.js"></script>
</body>

</html>
